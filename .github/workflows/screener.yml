name: Dynamic Asset Allocation & Portfolio Signal Engine

on:
  workflow_dispatch:
  schedule:
    # Every Tuesday to Saturday at 06:30 KST (21:30 UTC Mon-Fri, after US Market Close)
    - cron: '30 21 * * 1-5'

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Run Dynamic Asset Allocation Signal Engine
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          AUTH_PIN: ${{ secrets.AUTH_PIN }}
        run: |
          python screener.py
