name: Update ETF Backtest Dataset

on:
  workflow_dispatch:
  schedule:
    # Every Tuesday to Saturday at 06:30 KST (21:30 UTC Mon-Fri, after US Market Close)
    - cron: '30 21 * * 1-5'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Run ETF Dataset Builder
        run: |
          python build_etf_datasets.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/etf_history.json
          if git diff --staged --quiet; then
            echo "No new data changes to commit."
          else
            git commit -m "chore(data): auto-update ETF historical dataset [skip ci]"
            git push origin main
          fi
